name: growie-media-os
services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: mediaos_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run python scripts/dev.py setup}
      POSTGRES_DB: mediaos
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - mediaos_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediaos_admin -d mediaos"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["tools"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://mediaos_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/mediaos
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD}
    command: ["python", "-m", "app.admin", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  seed:
    extends:
      service: migrate
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./.local:/workspace/.local
    command: ["python", "-m", "app.seed"]
  api:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mediaos_runtime:${POSTGRES_RUNTIME_PASSWORD}@postgres:5432/mediaos
      AI_MOCK_MODE: ${AI_MOCK_MODE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_ENV: development
      MEDIA_LIVE_ENABLED: ${MEDIA_LIVE_ENABLED:-false}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      HEYGEN_API_KEY: ${HEYGEN_API_KEY:-}
      CONVERSION_DELIVERY_ENABLED: ${CONVERSION_DELIVERY_ENABLED:-false}
      CONVERSION_DELIVERY_CREDENTIALS: ${CONVERSION_DELIVERY_CREDENTIALS:-}
      SOCIAL_CONNECT_ENABLED: ${SOCIAL_CONNECT_ENABLED:-false}
      SOCIAL_PUBLISH_ENABLED: ${SOCIAL_PUBLISH_ENABLED:-false}
      SOCIAL_REPLY_ENABLED: ${SOCIAL_REPLY_ENABLED:-false}
      SOCIAL_APP_ID: ${SOCIAL_APP_ID:-}
      SOCIAL_APP_SECRET: ${SOCIAL_APP_SECRET:-}
      SOCIAL_API_VERSION: ${SOCIAL_API_VERSION:-}
      SOCIAL_REDIRECT_URI: ${SOCIAL_REDIRECT_URI:-}
      SOCIAL_PUBLIC_BASE_URL: ${SOCIAL_PUBLIC_BASE_URL:-}
      SOCIAL_VAULT_KEY: ${SOCIAL_VAULT_KEY:-}
      SOCIAL_WEBHOOK_VERIFY_TOKEN: ${SOCIAL_WEBHOOK_VERIFY_TOKEN:-}
      SOCIAL_SERVICE_TOKENS: ${SOCIAL_SERVICE_TOKENS:-}
      SOCIAL_STORAGE_PATH: /workspace/.local/social
    volumes:
      - ./.local/ingestion-credentials.json:/workspace/.local/ingestion-credentials.json:ro
      - type: bind
        source: ./.local/social-credentials.json
        target: /workspace/.local/social-credentials.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/renders
        target: /workspace/.local/renders
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/media
        target: /workspace/.local/media
        bind:
          create_host_path: false
      - type: bind
        source: ./.local/social
        target: /workspace/.local/social
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    environment:
      INTERNAL_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  mediaos_postgres:
