[project]
name = "growie-media-os-backend"
version = "0.1.0"
description = "Growie Media OS control plane and autonomous content workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "openai>=1.100",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=6.0",
  "temporalio>=1.15",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
