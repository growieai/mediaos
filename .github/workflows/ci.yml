name: Media OS verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: mediaos_admin
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: mediaos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mediaos_admin -d mediaos_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://mediaos_admin:ci-disposable-only@127.0.0.1:5432/mediaos_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://mediaos_admin:ci-disposable-only@127.0.0.1:5432/mediaos_test
      TEST_DATABASE_URL: postgresql+psycopg://mediaos_runtime:ci-runtime-only@127.0.0.1:5432/mediaos_test
      DATABASE_URL: postgresql+psycopg://mediaos_runtime:ci-runtime-only@127.0.0.1:5432/mediaos_test
      POSTGRES_RUNTIME_PASSWORD: ci-runtime-only
      POSTGRES_ADMIN_PASSWORD: ci-disposable-only
      AI_MOCK_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: pip install --require-hashes -r backend/requirements.lock
      - name: Install local media encoder for offline composition tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Migrate empty database and configure restricted login
        working-directory: backend
        run: python -m app.admin migrate
      - name: Lint, formatting and type checks
        working-directory: backend
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations
          mypy app
          ruff check --config pyproject.toml ../scripts/deployment.py
          ruff format --check --config pyproject.toml ../scripts/deployment.py
      - name: Unit and PostgreSQL integration tests (rebuilds disposable schema)
        working-directory: backend
        run: pytest -q --tb=short
      - name: Seed and acceptance simulation
        working-directory: backend
        run: |
          python -m app.seed
          python -m app.acceptance
          python -m app.community.acceptance
      - name: Frontend build
        working-directory: apps/console
        run: |
          npm ci
          npm test
          npm run build
      - name: Container configuration and builds
        run: |
          mkdir -p .local/media .local/social
          docker compose config --quiet
          docker compose build
      - name: Container startup and persisted API acceptance
        run: |
          export LOCAL_UID="$(id -u)" LOCAL_GID="$(id -g)"
          docker compose up -d --wait postgres
          docker compose run --rm migrate
          docker compose run --rm seed
          docker compose up -d --wait api console
          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
          cd backend
          ACCEPTANCE_API_URL=http://127.0.0.1:8000 python -m app.acceptance
          ACCEPTANCE_API_URL=http://127.0.0.1:3000 ACCEPTANCE_VIA_CONSOLE=true python -m app.community.acceptance
      - name: Standalone Compose syntax and pinned ingress validation
        env:
          SITE_DOMAIN: mediaos-ci.example.invalid
          ACME_EMAIL: operator@example.invalid
          OPS_ALLOWED_CIDRS: 192.0.2.10/32
        run: |
          # Synthetic interpolation only: no standalone deployment is started.
          fixture="$RUNNER_TEMP/mediaos-deployment-check"
          mkdir -p "$fixture/state" "$fixture/tls/data" "$fixture/tls/config"
          touch "$fixture/runtime.env" "$fixture/maintenance.env" "$fixture/postgres-password"
          export API_IMAGE=mediaos-ci-api:syntax-only CONSOLE_IMAGE=mediaos-ci-console:syntax-only
          export POSTGRES_IMAGE=postgres:18.4-bookworm CADDY_IMAGE=caddy:2.11.4
          export MEDIAOS_STATE_DIR="$fixture/state" MEDIAOS_TLS_DIR="$fixture/tls"
          export RUNTIME_ENV_FILE="$fixture/runtime.env" MAINTENANCE_ENV_FILE="$fixture/maintenance.env"
          export POSTGRES_PASSWORD_FILE="$fixture/postgres-password" POSTGRES_VOLUME=mediaos_ci_syntax_only
          docker compose -f deploy/compose.standalone.yml config --quiet
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/caddyserver/caddy/releases/download/v2.11.4/caddy_2.11.4_linux_amd64.tar.gz \
            -o "$fixture/caddy.tar.gz"
          echo "527fbf917c39189a1e3b31d34fa955601680b2d5c8055d2a87b8b9588dec7bb9  $fixture/caddy.tar.gz" | sha256sum --check
          tar -xzf "$fixture/caddy.tar.gz" -C "$fixture" caddy
          XDG_DATA_HOME="$fixture/data" XDG_CONFIG_HOME="$fixture/config" \
            "$fixture/caddy" validate --config deploy/Caddyfile --adapter caddyfile
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop disposable containers
        if: always()
        run: docker compose down --volumes
